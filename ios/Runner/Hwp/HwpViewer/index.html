<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>HWP</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; background: #8e8e93; -webkit-text-size-adjust: 100%; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }

  /* Mỗi trang là svg + một lớp phủ chồng khít lên nó. Lớp phủ giữ con trỏ và
     vệt bôi đen, nên chúng di chuyển được mà không phải vẽ lại svg. */
  /* Nền trắng ở đây chứ không chỉ ở `svg`: trang chưa dựng là khung rỗng, để
     trống thì nó lộ nền xám của body. */
  .page {
    position: relative; width: 100%; max-width: 900px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .page svg { display: block; width: 100%; height: auto; background: #fff; }
  .ov { position: absolute; inset: 0; pointer-events: none; }

  .caret {
    position: absolute; width: 2px; background: #0a84ff;
    animation: blink 1.06s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sel { position: absolute; background: rgba(10,132,255,.28); }

  /* Khác màu vệt bôi đen: hai thứ hiện được cùng lúc. */
  .find { position: absolute; background: rgba(255,214,10,.45); outline: 1px solid rgba(255,159,10,.9); }

  /* Chữ đang tổ hợp chưa nằm trong tài liệu nên nền phải đục: nó che phần chữ
     ngay sau con trỏ thay vì chồng lên. */
  .preedit {
    position: absolute; background: #fff; color: #000;
    text-decoration: underline; white-space: pre;
  }

  /* Bàn phím và IME của iOS chỉ làm việc với một phần tử soạn thảo thật. Nó
     bám theo con trỏ để iOS cuộn tới đúng chỗ và cửa sổ gợi ý tiếng Hàn hiện
     cạnh chữ đang gõ, chứ không phải ở góc màn hình. */
  #hwp-input {
    position: fixed; width: 1px; height: 1px; padding: 0; border: 0;
    opacity: 0; background: transparent; caret-color: transparent;
    resize: none; z-index: 1; font-size: 16px;
  }

  /* Trỏ font của tài liệu sang font iOS gần nhất. `local()` chỉ đổi tên, không
     tải gì. Số đo vẫn không trùng khít Hancom nhưng gần hơn hẳn so với rơi về
     font mặc định. */
  @font-face { font-family: "SimSun";        src: local("Songti SC"), local("Songti TC"); }
  @font-face { font-family: "NSimSun";       src: local("Songti SC"); }
  @font-face { font-family: "SimHei";        src: local("PingFang SC"); }
  @font-face { font-family: "Microsoft YaHei"; src: local("PingFang SC"); }

  @font-face { font-family: "바탕";          src: local("AppleMyungjo"); }
  @font-face { font-family: "바탕체";        src: local("AppleMyungjo"); }
  @font-face { font-family: "함초롬바탕";    src: local("AppleMyungjo"); }
  @font-face { font-family: "Batang";        src: local("AppleMyungjo"); }
  @font-face { font-family: "BatangChe";     src: local("AppleMyungjo"); }

  @font-face { font-family: "굴림";          src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "굴림체";        src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "돋움";          src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "돋움체";        src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "맑은 고딕";     src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "함초롬돋움";    src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "Gulim";         src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "Dotum";         src: local("Apple SD Gothic Neo"); }
  @font-face { font-family: "Malgun Gothic"; src: local("Apple SD Gothic Neo"); }

  #status { font: 15px -apple-system, sans-serif; color: #fff; text-align: center; padding: 24px 16px; }
  #status.error { color: #ffd8d6; }
</style>
</head>
<body>
<div id="status">Đang tải…</div>
<div id="pages"></div>

<script type="module">
const statusEl = document.getElementById('status');
const pagesEl = document.getElementById('pages');

function report(event, detail) {
  try {
    window.webkit?.messageHandlers?.hwpViewer?.postMessage({ event, detail: String(detail ?? '') });
  } catch (_) {}
}

// Đo chữ bằng Canvas cho rhwp. Có thể là code chết — rhwp 0.8.4 tự import
// `measureText` chứ không gọi `measureTextWidth` — nhưng bỏ nhầm thì ngắt dòng
// của cả trình xem hỏng lặng lẽ, nên giữ tới khi xác nhận được.
let measureCtx = null;
let lastFont = '';
globalThis.measureTextWidth = (font, text) => {
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  if (font !== lastFont) { measureCtx.font = font; lastFont = font; }
  return measureCtx.measureText(text).width;
};

function fail(message, error) {
  statusEl.hidden = false;
  statusEl.className = 'error';
  statusEl.textContent = message;
  report('hwp_viewer_failed', error?.stack || error || message);
}

/// Runtime của rhwp: WASM và trình soạn thảo. Không phụ thuộc tài liệu nào nên
/// khởi động một lần rồi dùng lại — tách ra để native hâm nóng trước được, chỗ
/// đó tốn ~1.8s và là phần lớn thời gian chờ khi mở tệp.
let runtimeReady = null;
let rhwp = null;
let editorModule = null;

function bootRuntime() {
  if (runtimeReady) return runtimeReady;
  runtimeReady = (async () => {
    const started = performance.now();
    report('hwp_boot_start', '');
    const module = await import('./rhwp.js');
    const imported = performance.now();
    await module.default({ module_or_path: './rhwp_bg.wasm' });
    const ready = performance.now();
    report(
      'hwp_wasm_ready',
      `import=${Math.round(imported - started)}ms compile=${Math.round(ready - imported)}ms`
        + ` in=${Math.round(ready - started)}ms`,
    );
    rhwp = module;
    editorModule = await import('./editor.js');
    report('hwp_runtime_ready', `in=${Math.round(performance.now() - started)}ms`);
  })();
  return runtimeReady;
}

/// Nạp tệp native đang phục vụ ở `/document` và vẽ ra. Gọi lại được — `attach`
/// tự dọn tài liệu trước đó, nên mở tệp sau không phải nạp lại trang.
async function loadDocument() {
  try {
    const started = performance.now();
    const warm = runtimeReady !== null;
    statusEl.hidden = false;
    statusEl.className = '';
    statusEl.textContent = 'Đang tải…';

    await bootRuntime();
    const ready = performance.now();

    const response = await fetch('./document', { cache: 'no-store' });
    if (!response.ok) throw new Error(`document fetch ${response.status}`);
    const bytes = new Uint8Array(await response.arrayBuffer());
    const fetched = performance.now();

    // Đúng một `HwpDocument` cho cả xem lẫn sửa. Tuyệt đối không dựng
    // `HwpViewer` quanh nó: constructor của lớp đó **tiêu huỷ** document và ta
    // mất sạch API soạn thảo.
    const doc = new rhwp.HwpDocument(bytes);
    const parsed = performance.now();
    report(
      'hwp_document_parsed',
      `pages=${doc.pageCount()} bytes=${bytes.length}`
        + ` fetch=${Math.round(fetched - ready)}ms parse=${Math.round(parsed - fetched)}ms`,
    );

    const editor = editorModule.attach(doc, pagesEl, report);

    statusEl.hidden = true;
    const total = editor.renderPages(0);
    const done = performance.now();
    report(
      'hwp_render_done',
      `pages=${total} frames=${Math.round(done - parsed)}ms`
        + ` boot=${Math.round(done - started)}ms warm=${warm ? 1 : 0}`,
    );
  } catch (error) {
    fail('Không mở được tệp HWP này.', error);
  }
}

/// Native gọi xuống qua `evaluateJavaScript`. Tách khỏi `__rhwpEditor` vì cái
/// đó chỉ tồn tại khi đang có tài liệu mở.
window.__rhwpHost = {
  loadDocument,
  /// Đóng tài liệu nhưng giữ runtime: process WebKit và WASM đã biên dịch ở lại.
  unload() {
    editorModule?.detach();
    statusEl.hidden = true;
    report('hwp_document_unloaded', '');
  },
  /// Khởi động runtime mà không mở tệp nào, để lần mở thật chỉ còn phần parse.
  prewarm() {
    bootRuntime().then(
      () => report('hwp_prewarm_ready', ''),
      (error) => report('hwp_prewarm_failed', String((error && error.stack) || error)),
    );
  },
};

// Trang vỏ được nạp với `?prewarm=1` khi native chỉ muốn hâm nóng: chưa có tệp
// nào ở `/document`, nên đừng đi tìm.
if (new URLSearchParams(location.search).get('prewarm') === '1') {
  statusEl.hidden = true;
  window.__rhwpHost.prewarm();
} else {
  loadDocument();
}

</script>
</body>
</html>
